about: |
  I am an Assistant Professor in the Department of Artificial Intelligence and
  Machine Learning at Marmara University, and an Affiliate Research Software
  Engineering Scientist with the Geospatial Data Science Group at the
  University of Glasgow. I hold a PhD in Applied Informatics from Istanbul
  Technical University.

  My research sits at the intersection of geospatial artificial intelligence
  and multimodal learning. I use vision-language models, retrieval-augmented
  generation and computer vision to analyse street-level imagery, remote
  sensing data and the spatio-temporal patterns of cities. Recent work
  includes street-level geolocalization with multimodal large language
  models, multimodal semantic segmentation for urban mapping, and evaluating
  the integrity of explanations produced by vision-language models.

  Before my current roles I was a postdoctoral researcher at UCL's Jill Dando
  Institute of Security and Crime Science, where I applied natural language
  processing and geospatial AI to large-scale crime mapping.

