# Site configuration. All CV content lives in data/*.yaml — this file only
# holds site-wide settings and the terminal look and feel.

baseURL: "https://yunusserhat.com/"
theme: "terminalcv"
title: "Yunus Serhat Bıçakçı"

locale: "en-GB"
defaultContentLanguage: "en"
enableRobotsTXT: true

params:
  description: >-
    Yunus Serhat Bıçakçı, PhD — Assistant Professor at Marmara University and
    Affiliate Research Software Engineering Scientist at the University of
    Glasgow, working on GeoAI, multimodal learning, computer vision, spatial
    data science and vision-language models.
  ogImage: "images/profile/yunus-serhat-bicakci.jpg"
  twitterHandle: "yunusserhat"
  customCSS: true

  # ASCII banner shown on load (hidden on narrow screens). Stored as a list
  # of strings so leading spaces and backslashes survive YAML parsing.
  greetingBannerColor: "#d97757"
  greetingBanner:
    - "                                           _           _   "
    - " _   _ _   _ _ __  _   _ ___ ___  ___ _ __| |__   __ _| |_ "
    - "| | | | | | | '_ \\| | | / __/ __|/ _ \\ '__| '_ \\ / _` | __|"
    - "| |_| | |_| | | | | |_| \\__ \\__ \\  __/ |  | | | | (_| | |_ "
    - " \\__, |\\__,_|_| |_|\\__,_|___/___/\\___|_|  |_| |_|\\__,_|\\__|"
    - " |___/                                                     "

  blog:
    enabled: true
    lsClassic: true

  prompt:
    core:
      before: "["
      beforeColor: "#8b949e"
      text: "yunus@geoai"
      color: "#7ee787"
      after: "]"
      afterColor: "#8b949e"
    path:
      before: "["
      beforeColor: "#8b949e"
      text: "~/research"
      color: "#79c0ff"
      after: "]"
      afterColor: "#8b949e"
    extra:
      text: "$ "
      color: "#c9d1d9"
